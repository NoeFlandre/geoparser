[project]
name = "geoparser"
version = "0.6.0"
description = "A customizable geoparsing library for unstructured text"
authors = [{ name = "Diego Gomes", email = "diego.gomes@uzh.ch" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    # Not imported directly: transformers' Trainer (behind
    # SentenceTransformerTrainer in SentenceTransformerResolver.fit) requires it.
    "accelerate>=1.11.0,<2",
    "platformdirs>=4.2.0,<5",
    "datasets>=5.0.0,<6",
    "duckdb>=1.5.4,<2",
    "fastapi>=0.141.1,<1",
    "markupsafe>=3.0.3,<4",
    "pydantic>=2.12.3,<3",
    "pyproj>=3.7.1,<4",
    # Not imported directly: FastAPI needs it to parse the annotator's
    # Form/UploadFile request bodies.
    "python-multipart>=0.0.31,<1",
    "pyyaml>=6.0.3,<7",
    "rapidfuzz>=3.14.5,<4",
    "requests>=2.32.5,<3",
    "rich>=15.0.0,<16",
    # GLiNER2's [local] extra caps Transformers below 5, so keep the model
    # runtime requirements explicit while allowing the security-patched 5.x.
    "gliner2>=2.0.0,<3",
    "numpy>=1.24,<3",
    "safetensors>=0.4,<1",
    # Not imported directly: gliner2 imports it for its models and LoRA
    # training code.
    "peft>=0.15.2,<1",
    # GLiNER2's tokenizer is a sentencepiece model, which transformers can only
    # convert to its fast tokenizer with protobuf available. Without these the
    # recognizer fails at load time, not at import.
    "protobuf>=6.33.1,<8",
    "sentence-transformers>=5.1.2,<6",
    "sentencepiece>=0.2.1,<1",
    "shapely>=2.1.2,<3",
    # 3.8.14 has cp314 wheels on GitHub but not on PyPI (explosion/spaCy#13949)
    "spacy>=3.8.7,<4,!=3.8.14",
    # Transformer pipelines use the curated_transformer factory supplied by
    # this plugin. It has no Python 3.14 release yet; SpacyRecognizer gives an
    # actionable non-transformer fallback on that interpreter.
    "spacy-curated-transformers>=0.3.1,<1; python_full_version < '3.14'",
    "sqlalchemy>=2.0.44,<3",
    "sqlmodel>=0.0.39,<0.0.40",
    "torch>=2.9.0,<3",
    # Transformers 5.17.0 fixes CVE-2026-80047. GLiNER2 runtime requirements
    # are listed directly above instead of its stale [local] extra, which
    # caps Transformers below 5.
    "transformers>=5.17.0,<6",
    "typer>=0.27.0,<0.28",
    "uvicorn>=0.38.0,<0.39",
    "werkzeug>=3.1.3,<4",
]

[project.scripts]
geoparser = "geoparser.__main__:main"

[project.urls]
Homepage = "https://geoparser.app"
Repository = "https://github.com/NoeFlandre/geoparser"
Changelog = "https://github.com/NoeFlandre/geoparser/blob/main/CHANGELOG.md"

[dependency-groups]
# Everything needed to develop, test and document the project. `uv sync`
# installs this group by default, so a bare clone is one command from a
# working environment.
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "demo" },
    # scripts/benchmark/publish.py uploads to the Hub; declared here rather
    # than relied on transitively through datasets.
    "huggingface-hub>=1.5.0,<2",
]
# Kept separate so CI can install the linters without pulling torch and the
# CUDA stack; this is what keeps the lint job at a few seconds.
lint = [
    "ruff==0.16.6",
    "ty==0.0.78",
    "pre-commit>=4.3.0,<5",
    # radon + coverage are what scripts/crap.py needs to combine complexity
    # with coverage; coverage also backs the combined report in CI.
    "radon>=6.0.1,<7",
    "coverage[toml]>=7.0,<8",
    "deptry>=0.23.1,<0.24",
]
test = [
    "pytest>=8.4.2,<10",
    "pytest-cov>=7.0.0,<8",
    "pytest-benchmark>=5,<6",
    "hypothesis>=6.140.0,<7",
    "pytest-bdd>=8.1.0,<9",
    "tomli>=2.0.1,<3; python_version < \"3.11\"",
    "requests-mock>=1.12.1,<2",
    "mutmut>=3.7.0,<4",
    "radon>=6.0.1,<7",
    "en-core-web-sm",
    "xx-sent-ud-sm",
]
docs = [
    "mkdocs-material>=9.6.0,<10",
    "mkdocstrings[python]>=0.29.0,<1",
]
demo = [
    "jupyter>=1.1.1,<2",
    "plotly>=6.0.0,<7",
]

# spaCy models are not on PyPI; they are published as GitHub release artifacts.
[tool.uv]
# One uv for CI and the Docker image: setup-uv reads this setting, and the
# Dockerfile's `ghcr.io/astral-sh/uv` tag must match it. Bump both together.
required-version = "==0.11.16"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz" }
xx-sent-ud-sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_sent_ud_sm-3.8.0/xx_sent_ud_sm-3.8.0.tar.gz" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoparser"]

[tool.hatch.build.targets.sdist]
include = ["geoparser", "LICENSE", "README.md", "ROADMAP.md", "CHANGELOG.md"]

[tool.deptry]
# The lint job runs deptry without installing the project, so import names
# that differ from distribution names are spelled out here.
package_module_name_map = { pyyaml = "yaml", huggingface-hub = "huggingface_hub" }

[tool.deptry.per_rule_ignores]
# DEP002: used without a direct import. accelerate, numpy, peft, protobuf,
# safetensors and sentencepiece are loaded at runtime by transformers/gliner2;
# python-multipart backs FastAPI's form uploads; spacy-curated-transformers
# registers the curated_transformer factory for spaCy's trf pipelines.
DEP002 = [
    "accelerate",
    "numpy",
    "peft",
    "protobuf",
    "python-multipart",
    "safetensors",
    "sentencepiece",
    "spacy-curated-transformers",
]
# DEP004: dev-only imports outside the package: scripts/crap.py (coverage,
# radon), scripts/benchmark/publish.py (huggingface_hub),
# scripts/changed_mutation_patterns.py (mutmut, and tomli on Python 3.10) and
# the demo notebook (plotly).
# None of them ship in the wheel.
DEP004 = [
    "coverage",
    "huggingface_hub",
    "mutmut",
    "plotly",
    "radon",
    "tomli",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
# E/W/F are the pyflakes+pycodestyle baseline black and autoflake used to cover
# (F401 replaces autoflake's unused-import pass); I replaces isort; the rest are
# the low-noise correctness and modernization rules worth enforcing here.
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF",
    # Anti-pattern families (#58): blind excepts, naive datetimes, bandit
    # security checks, stray prints, unused arguments, pylint, pathlib,
    # return style, misc idioms, performance, no blanket noqa, complexity.
    "BLE", "DTZ", "S", "T20", "ARG", "PL", "PTH", "RET", "PIE", "PERF", "PGH",
    "C90",
    # Exception messages and API shape (#59). FBT and N818 hits in the public
    # API are ratcheted with code-specific noqa comments, to be removed when
    # the signatures and names change in the next major release.
    "EM", "TRY", "FBT", "N",
]
ignore = [
    # Formatter owns line length; long strings and comments are not worth churning.
    "E501",
    # Named constants for every literal compared against are more noise than
    # signal in parsing and geometry code.
    "PLR2004",
    # Deferred imports are deliberate: they keep `geoparser --help` and the
    # lazy module registry from importing torch and spaCy.
    "PLC0415",
    # try/except inside a loop is how per-item failures are isolated; the
    # overhead ruff warns about is gone in Python 3.11+.
    "PERF203",
    # Descriptive exception messages are the point; EM already keeps them
    # out of the raise line.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the point of these files.
"__init__.py" = ["F401"]
# Tests assert, build throwaway paths and SQL, shell out to tools, and stub
# signatures whose arguments they ignore; none of that is production code.
"tests/**" = [
    "S", "ARG", "T20", "PLR", "PLW", "PTH", "DTZ", "BLE", "C90",
    "EM", "TRY", "FBT", "N802",
]
# Developer scripts report to the terminal and shell out to git, uv and
# docker by name.
"scripts/**" = ["T20", "S603", "S607"]
# FastAPI injects route dependencies and exception-handler arguments by
# signature, so handlers declare parameters they only need to exist.
"geoparser/annotator/app.py" = ["ARG001"]
"geoparser/annotator/exceptions.py" = ["ARG001"]
# Typer builds each command's options from its signature: one parameter per
# flag is the API, not a design smell.
# Boolean parameters there are --flag options, not positional arguments.
"geoparser/cli/**" = ["PLR0913", "PLR0917", "FBT001", "FBT002"]
# Public boolean options that callers may pass positionally: making them
# keyword-only would break existing call sites, so they are kept as is.
"geoparser/annotator/db/crud/document.py" = ["FBT001", "FBT002"]
"geoparser/annotator/db/crud/session.py" = ["FBT001", "FBT002"]
"geoparser/annotator/server.py" = ["FBT001", "FBT002"]
"geoparser/gazetteer/build/builder.py" = ["FBT001", "FBT002"]
"geoparser/gazetteer/build/progress.py" = ["FBT001", "FBT002"]
"geoparser/geoparser/geoparser.py" = ["FBT001", "FBT002"]
"geoparser/project/project.py" = ["FBT001", "FBT002"]
# The demo notebook reports its progress to the reader.
"demo/**" = ["T20"]

[tool.ruff.lint.mccabe]
# Lock in the current ceiling next to the CRAP gate.
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.isort]
known-first-party = ["geoparser"]

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]
markers = [
    "unit: Fast, isolated unit tests with mocked dependencies",
    "integration: Integration tests with real models and database",
    "e2e: End-to-end pipeline tests",
    "property: Property-based tests over generated inputs",
    "acceptance: Executable user-facing acceptance scenarios",
    "architecture: Automated import and dependency-boundary checks",
    "benchmark: Opt-in performance checks over synthetic data",
]
addopts = [
    "--strict-markers",
    "-m",
    "not benchmark",
    "--cov=geoparser",
    "--cov=scripts",
    "--cov=tests",
    "--cov-report=term-missing",
    "--cov-config=pyproject.toml",
]
console_output_style = "progress"
tmp_path_retention_policy = "failed"

[tool.mutmut]
# Mutation testing: mutmut edits the source in small ways and re-runs the
# tests; a mutant that survives is a line the suite does not really check.
source_paths = ["geoparser"]
# Database repositories and models are covered by the annotator unit tests and
# stay in mutation scope. The web surface and CLI are argument/UI wiring.
do_not_mutate = [
    "geoparser/annotator/app.py",
    "geoparser/annotator/constants.py",
    "geoparser/annotator/dependencies.py",
    "geoparser/annotator/exceptions.py",
    "geoparser/annotator/metadata.py",
    "geoparser/annotator/models/*",
    "geoparser/annotator/routes/*",
    "geoparser/annotator/server.py",
    "geoparser/cli/*",
    # The build pipeline assembles SQL and drives duckdb; the unit suite mocks
    # that away, so its mutants can only be judged by the integration suite,
    # which rebuilds a real gazetteer per mutant (~23s each, ~13h for the
    # package). It is covered instead by those integration tests and by the
    # 100% coverage gate. Mutation testing stays where it is cheap to run
    # often, and is expected to leave no survivor there.
    "geoparser/gazetteer/build/*",
]
# Mutants are judged by the unit suite. Adding the integration suite was
# measured: it does remove every "no tests" mutant and cuts survival from 29%
# to about 11%, but each mutant it reaches then rebuilds a real gazetteer --
# roughly 23 seconds per mutant, some thirteen hours for the package. The
# integration and e2e suites plus the 100% coverage gate cover that code
# instead; mutation testing stays where it is cheap enough to run often.
pytest_add_cli_args_test_selection = ["tests/unit"]
# Coverage instrumentation is pure overhead here, and is re-collected per
# mutant otherwise.
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
# mutmut runs the suite from a copied tree; the schema tests validate the
# example config that the gazetteers guide walks through, so it has to come
# along or every mutant "fails" for want of a file.
also_copy = [
    "docs",
    ".gitattributes",
    # The documentation guard scans the public surfaces for transformer
    # examples; without these it finds nothing to check and every mutant
    # "fails" for want of a file rather than because it survived.
    "README.md",
    "demo",
    "scripts",
    ".github",
    ".dockerignore",
    ".pre-commit-config.yaml",
    "CHANGELOG.md",
    "CITATION.cff",
    "Dockerfile",
    "compose.yaml",
    "mkdocs.yml",
    # Local link targets of README.md, checked by the packaging tests.
    "ROADMAP.md",
    "CONTRIBUTING.md",
    # Mutation-report contract tests read the recorded campaign evidence.
    "MUTATION_TESTING.md",
    # Historical provenance contracts must run in the copied mutation tree too.
    "benchmark-evidence/panx/feasibility-2026-09-30",
    "LICENSE",
]

[tool.coverage.report]
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@(t\\.|typing\\.)?overload",
    "if t.TYPE_CHECKING:",
    ]

[tool.coverage.run]
# sys.monitoring instead of the sys.settrace tracer: ~20% off the measured
# runs, with byte-identical results. Coverage falls back to the default core
# on Python 3.10/3.11, where sys.monitoring does not exist, and the warning
# about doing so is silenced because that fallback is expected here.
core = "sysmon"
disable_warnings = ["no-sysmon"]
# CRAP scores every first-party function, including tooling and test helpers.
# The hard line-coverage percentage remains scoped to the installable package.
source = ["geoparser", "scripts", "tests"]
relative_files = true

[tool.coverage.paths]
source = [
    'geoparser/',
    "geoparser\\",
]
scripts = [
    'scripts/',
    "scripts\\",
]
tests = [
    'tests/',
    "tests\\",
]

[tool.ty.analysis]
allowed-unresolved-imports = ["tomli"]

[tool.ty.src]
include = ["geoparser", "scripts", "tests"]
