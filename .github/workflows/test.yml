name: Tests

on:
  pull_request:
    branches:
      - main
  # The trunk itself is also tested. This is what keeps the README badges alive,
  # seeds the default-branch Actions cache that every pull request restores from
  # (caches written by a pull request are scoped to that pull request alone), and
  # catches two pull requests that pass separately but break once both are merged.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request commit is free; superseding a trunk commit would
  # leave a commit on main permanently untested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The hard coverage gate, applied to the combined report across the whole
  # matrix. Single cells are not gated: platform-specific branches are
  # unreachable off their own operating system, so only the combination is a
  # fair measure -- and the combination is a union, so it can only be higher
  # than any one cell. Raise this when coverage rises; never lower it to go green.
  COVERAGE_THRESHOLD: "100"
  # The worst tolerated CRAP score (complexity^2 * (1-coverage)^3 + complexity).
  # For fully covered code this is just a cyclomatic-complexity ceiling, so at
  # 6 every measured function must stay under six branches.
  CRAP_THRESHOLD: "6"

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # uv provides the interpreter on every platform, so all three operating
      # systems take the same path; this replaces the setup-python/brew split.
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # torch pulls the full CUDA stack on Linux, which does not fit alongside
      # the toolchains preinstalled on the runner image.
      - name: Free up disk space (Linux only)
        if: runner.os == 'Linux'
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android
          echo "Disk space after cleanup:"
          df -h

      - name: Install project dependencies
        run: uv sync --locked

      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Run pytest
        run: uv run --no-sync pytest -v

      - run: mkdir coverage
      - run: mv .coverage coverage/.coverage.${{ runner.os }}-py${{ matrix.python-version }}
      - name: Store coverage files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage
          include-hidden-files: true

  coverage:
    needs: [pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The coverage comment action stores its badge data on a branch with git,
      # so this checkout keeps its credentials; the job runs no PR-controlled
      # code after combining coverage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Get coverage files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          pattern: coverage-*
          path: coverage
      # Only the tools needed to combine and gate; no torch.
      - run: uv sync --locked --only-group lint
      - run: uv run --no-sync coverage combine coverage
      - run: uv run --no-sync coverage report

      # The hard gate. Runs before the reporting steps so a coverage drop fails
      # the build rather than being quietly published.
      - name: Enforce the coverage threshold
        run: uv run --no-sync coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

      # Complexity is only half of CRAP; the other half is the combined
      # coverage that has just been assembled, so the gate lives here.
      - name: Enforce the CRAP threshold
        run: uv run --no-sync python scripts/crap.py --max-crap ${{ env.CRAP_THRESHOLD }}

      - run: uv run --no-sync coverage html --show-contexts --title "geoparser coverage for ${{ github.sha }}"

      # tests-passed depends on this job, so a hiccup in a third-party commenting
      # action must not become a merge blocker. The comment itself is posted by
      # the Coverage comment workflow from the artifact written here.
      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 100
          MINIMUM_ORANGE: 98
      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
      - name: Store coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
      - name: Store coverage html
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-html
          path: htmlcov

  # The one check the branch ruleset requires. Matrix job names encode the
  # matrix values, so requiring those directly deadlocks the ruleset as soon as
  # the matrix changes; this name never does.
  tests-passed:
    if: always()
    needs: [pytest, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
