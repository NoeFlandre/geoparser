name: Coverage preview

# Publish coverage only for a successful pull-request test run.
# workflow_run lets the base repository publish the report for fork PRs; the
# downloaded HTML is uploaded as data, never executed.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed

permissions:
  contents: read

jobs:
  upload:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write
      # Listing the triggering run and downloading its artifacts.
      actions: read
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-html
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: coverage-html
      - name: Validate coverage report artifact
        run: test -s coverage-html/index.html
      # Set this repository variable to "true" only after rotating the
      # Smokeshow key and reviewing the affected historical logs.
      - name: Install Smokeshow
        if: vars.GEOPARSER_SMOKESHOW_AUTH_ROTATION_CONFIRMED == 'true'
        run: pip install smokeshow
      - name: Publish coverage preview
        if: vars.GEOPARSER_SMOKESHOW_AUTH_ROTATION_CONFIRMED == 'true'
        run: |
          set +x
          smokeshow upload coverage-html
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Coverage {coverage-percentage}
          SMOKESHOW_GITHUB_CONTEXT: coverage
          SMOKESHOW_GITHUB_COVERAGE_THRESHOLD: 98
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SMOKESHOW_AUTH_KEY: ${{ secrets.SMOKESHOW_AUTH_KEY }}
