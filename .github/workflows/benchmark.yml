name: Benchmarks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Branch, tag, or commit to compare against
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.state == 'open' }}

jobs:
  compare:
    if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
    name: compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install benchmark dependencies without spaCy model artifacts
        run: >-
          uv sync --locked --no-default-groups --group test
          --no-install-package en-core-web-sm
          --no-install-package xx-sent-ud-sm

      - name: Run algorithmic guards
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
          HF_HOME: ${{ github.workspace }}/.tmp/huggingface
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
            --confcutdir=tests/benchmarks \
            -o addopts='' \
            -m benchmark \
            --benchmark-disable \
            tests/benchmarks/test_guards.py

      - name: Prepare pull request base
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref || 'main' }}
          TMPDIR: ${{ github.workspace }}/.tmp
          HF_HOME: ${{ github.workspace }}/.tmp/huggingface
        run: |
          mkdir -p .tmp
          git fetch --no-tags origin "$BASE_REF"
          git worktree add --detach .tmp/main FETCH_HEAD
          mkdir -p .tmp/main/tests
          cp -R tests/benchmarks .tmp/main/tests/
          uv sync --locked --project .tmp/main --no-default-groups --group test \
            --no-install-package en-core-web-sm \
            --no-install-package xx-sent-ud-sm
          uv pip install --python .tmp/main/.venv/bin/python "pytest-benchmark==5.3.0"

      - name: Measure base and head in counterbalanced order
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
          HF_HOME: ${{ github.workspace }}/.tmp/huggingface
        run: |
          mkdir -p .tmp/benchmark-pairs
          run_benchmark() {
            label="$1"
            project="$2"
            interpreter="$3"
            (
              cd "$project"
              "$interpreter" -m pytest \
                --confcutdir=tests/benchmarks \
                -o addopts='' \
                -o markers=benchmark \
                -m benchmark \
                --benchmark-only \
                --benchmark-json="$GITHUB_WORKSPACE/.tmp/benchmark-pairs/$label.json" \
                tests/benchmarks/test_performance.py
            )
          }

          # Balance runner position: head, base, base, head, base, head.
          run_benchmark head-1 "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.venv/bin/python"
          run_benchmark base-1 "$GITHUB_WORKSPACE/.tmp/main" "$GITHUB_WORKSPACE/.tmp/main/.venv/bin/python"
          run_benchmark base-2 "$GITHUB_WORKSPACE/.tmp/main" "$GITHUB_WORKSPACE/.tmp/main/.venv/bin/python"
          run_benchmark head-2 "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.venv/bin/python"
          run_benchmark base-3 "$GITHUB_WORKSPACE/.tmp/main" "$GITHUB_WORKSPACE/.tmp/main/.venv/bin/python"
          run_benchmark head-3 "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Enforce median regression limit
        run: >-
          "$GITHUB_WORKSPACE/.venv/bin/python"
          scripts/benchmark/compare.py
          .tmp/benchmark-pairs/base-1.json
          .tmp/benchmark-pairs/head-1.json
          --additional-baseline .tmp/benchmark-pairs/base-2.json
          --additional-candidate .tmp/benchmark-pairs/head-2.json
          --additional-baseline .tmp/benchmark-pairs/base-3.json
          --additional-candidate .tmp/benchmark-pairs/head-3.json

      - name: Store paired benchmark reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paired-benchmark-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/benchmark-pairs/*.json
          if-no-files-found: warn
          retention-days: 14
