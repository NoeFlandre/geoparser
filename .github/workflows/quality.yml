name: Quality

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Quality gauntlet or a bounded timeout-mutant diagnostic replay
        required: true
        type: choice
        default: quality
        options:
          - quality
          - targeted-mutant-replay
      mutant_ids:
        description: Exact allowlisted mutant IDs, one per line (maximum eight)
        required: false
        type: string
      expected_sha:
        description: Full source SHA recorded by the timeout allowlist
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    needs: [changed-mutation]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'targeted-mutant-replay')
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Require the changed mutation gate to pass
        if: >-
          always() && github.event_name == 'pull_request' &&
          needs.changed-mutation.result != 'success'
        run: |
          echo "::error::The changed mutation gate did not pass."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android

      - name: Install locked project dependencies
        run: uv sync --locked

      - name: Install DuckDB spatial extension
        run: uv run --no-sync python -c "import duckdb; connection = duckdb.connect(); connection.install_extension('spatial'); connection.close()"

      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Run the complete deterministic quality gauntlet
        env:
          # The PR CRAP check measures integration test functions too. Execute
          # their real-model assertions on this bounded, single CPU runner.
          GEOPARSER_TEST_REMOTE_MODELS: '1'
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            uv run --no-sync python scripts/quality_gauntlet.py
          else
            uv run --no-sync python scripts/quality_gauntlet.py --skip-docker --skip-mutation
          fi

  exact-mutant-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'targeted-mutant-replay'
    name: exact-mutant-replay
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate the exact selection before installing dependencies
        env:
          MUTANT_IDS: ${{ inputs.mutant_ids }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          helper="$RUNNER_TEMP/replay-helper"
          mkdir -p "$helper/scripts"
          cp scripts/mutation_replay.py scripts/mutation_evidence.py \
            scripts/mutation_replay_allowlist.json "$helper/scripts/"
          printf '%s\n' "$MUTANT_IDS" > "$RUNNER_TEMP/mutation-replay-ids.txt"
          PYTHONDONTWRITEBYTECODE=1 python scripts/mutation_replay.py \
            --selection-file "$RUNNER_TEMP/mutation-replay-ids.txt" \
            --expected-sha "$EXPECTED_SHA" \
            --actual-sha "$EXPECTED_SHA" \
            --validate-only > "$RUNNER_TEMP/validated-mutant-ids.txt"
          cat "$RUNNER_TEMP/validated-mutant-ids.txt"

      - name: Check out the validated evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Verify the actual source checkout before dependency installation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          helper="$RUNNER_TEMP/replay-helper"
          PYTHONPATH="$helper" python "$helper/scripts/mutation_replay.py" \
            --allowlist "$helper/scripts/mutation_replay_allowlist.json" \
            --selection-file "$RUNNER_TEMP/validated-mutant-ids.txt" \
            --expected-sha "$EXPECTED_SHA" \
            --actual-sha "$(git rev-parse HEAD)" --validate-only

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install locked test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Install DuckDB spatial extension
        run: |
          uv run --no-sync python -c "import duckdb; connection = duckdb.connect(); connection.install_extension('spatial'); connection.close()"

      - name: Replay selected timeout mutants
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          helper="$RUNNER_TEMP/replay-helper"
          PYTHONPATH="$helper" uv run --no-sync python "$helper/scripts/mutation_replay.py" \
            --allowlist "$helper/scripts/mutation_replay_allowlist.json" \
            --selection-file "$RUNNER_TEMP/validated-mutant-ids.txt" \
            --expected-sha "$EXPECTED_SHA" \
            --actual-sha "$(git rev-parse HEAD)" \
            --evidence-dir mutation-replay

      - name: Upload exact-mutant replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-replay-${{ github.run_id }}-${{ github.sha }}
          path: mutation-replay/
          if-no-files-found: warn
          retention-days: 90

  changed-mutation:
    if: github.event_name == 'pull_request'
    name: changed-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install locked test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Install DuckDB spatial extension
        run: |
          uv run --no-sync python -c "import duckdb; connection = duckdb.connect(); connection.install_extension('spatial'); connection.close()"

      - name: Mutate changed package modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        shell: bash
        run: |
          scope_text="$(uv run --no-sync python scripts/changed_mutation_patterns.py "$BASE_SHA" "$HEAD_SHA")"
          full_mutation=false
          if [[ "$scope_text" == "FULL_MUTATION" ]]; then
            full_mutation=true
            patterns_text=""
          else
            patterns_text="$scope_text"
          fi
          if [[ -z "$patterns_text" && "$full_mutation" == false ]]; then
            echo "No changed geoparser Python modules to mutate."
            exit 0
          fi
          if [[ "$full_mutation" == true ]]; then
            echo "Test or mutation configuration changes require a full mutation sweep."
            patterns=()
          else
            mapfile -t patterns <<< "$patterns_text"
          fi
          mkdir -p mutants mutation-evidence
          rm -f mutants/mutmut-cicd-stats.json
          run_status=0
          if [[ "$full_mutation" == true ]]; then
            uv run --no-sync mutmut run --max-children 1 \
              > mutation-evidence/mutmut-run.log 2>&1 || run_status=$?
          else
            uv run --no-sync mutmut run --max-children 1 "${patterns[@]}" \
              > mutation-evidence/mutmut-run.log 2>&1 || run_status=$?
          fi
          cat mutation-evidence/mutmut-run.log
          export_status=0
          uv run --no-sync mutmut export-cicd-stats \
            > mutation-evidence/stats-export.log 2>&1 || export_status=$?
          cat mutation-evidence/stats-export.log
          gate_status=0
          if (( export_status != 0 )); then
            gate_status=1
            echo "Mutation stats export failed; the mutation gate cannot pass." \
              > mutation-evidence/mutation-gate.log
          else
            if [[ "$full_mutation" == true ]]; then
              gate_args=(
                --max-survivors 0
                --max-no-tests 69
                --stats mutants/mutmut-cicd-stats.json
              )
            else
              gate_args=(
                --max-survivors 0
                --max-no-tests 0
                --stats mutants/mutmut-cicd-stats.json
                --patterns "${patterns[@]}"
              )
            fi
            uv run --no-sync python scripts/mutation_gate.py "${gate_args[@]}" \
              > mutation-evidence/mutation-gate.log 2>&1 || gate_status=$?
          fi
          cat mutation-evidence/mutation-gate.log
          evidence_scope=()
          if [[ "$full_mutation" == false ]]; then
            evidence_scope+=(--patterns "${patterns[@]}")
          fi
          evidence_status=0
          uv run --no-sync python scripts/mutation_evidence.py \
            --evidence-dir mutation-evidence \
            --stats mutants/mutmut-cicd-stats.json \
            --run-exit-code "$run_status" \
            --export-exit-code "$export_status" \
            --gate-exit-code "$gate_status" \
            "${evidence_scope[@]}" || evidence_status=$?
          if (( evidence_status != 0 )); then
            exit "$evidence_status"
          fi
          if (( run_status != 0 )); then
            exit "$run_status"
          fi
          if (( export_status != 0 )); then
            exit "$export_status"
          fi
          exit "$gate_status"

      - name: Upload per-mutant evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-evidence-${{ github.run_id }}-${{ github.event.pull_request.head.sha }}
          path: mutation-evidence/
          if-no-files-found: warn
          retention-days: 90
