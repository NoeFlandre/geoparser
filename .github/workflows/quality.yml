name: Quality

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && format('metadata-{0}', github.run_id) || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) }}

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-edit-ignored (quality-gate)' || 'quality-gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android

      - name: Install locked project dependencies
        run: uv sync --locked

      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Run the complete deterministic quality gauntlet
        env:
          GEOPARSER_TEST_REMOTE_MODELS: ${{ github.event_name == 'schedule' && '1' || '' }}
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            uv run --no-sync python scripts/quality_gauntlet.py --skip-baseline
          else
            uv run --no-sync python scripts/quality_gauntlet.py --skip-baseline --skip-docker --skip-mutation
          fi

  changed-mutation:
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null)
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-edit-ignored (changed-mutation)' || 'changed-mutation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install locked test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Install DuckDB spatial extension
        run: |
          uv run --no-sync python -c "import duckdb; connection = duckdb.connect(); connection.install_extension('spatial'); connection.close()"

      - name: Mutate changed package modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          patterns_text="$(uv run --no-sync python scripts/changed_mutation_patterns.py "$BASE_SHA" "$HEAD_SHA")"
          if [[ -z "$patterns_text" ]]; then
            echo "No changed geoparser Python modules to mutate."
            exit 0
          fi
          mapfile -t patterns <<< "$patterns_text"
          mkdir -p mutants
          rm -f mutants/mutmut-cicd-stats.json
          run_status=0
          uv run --no-sync mutmut run "${patterns[@]}" || run_status=$?
          export_status=0
          uv run --no-sync mutmut export-cicd-stats || export_status=$?
          if (( export_status != 0 )); then
            exit "$export_status"
          fi
          gate_status=0
          uv run --no-sync python scripts/mutation_gate.py \
            --max-survivors 0 \
            --max-no-tests 0 \
            --stats mutants/mutmut-cicd-stats.json \
            --patterns "${patterns[@]}" || gate_status=$?
          if (( gate_status != 0 )); then
            while IFS= read -r mutant; do
              [[ -z "$mutant" ]] || uv run --no-sync mutmut show "$mutant"
            done < <(
              uv run --no-sync mutmut results --all true \
                | sed -n 's/^[[:space:]]*\(geoparser\..*\): survived$/\1/p'
            )
          fi
          if (( run_status != 0 )); then
            exit "$run_status"
          fi
          exit "$gate_status"
