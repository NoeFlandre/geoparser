name: Docker smoke

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && format('metadata-{0}', github.run_id) || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) }}

jobs:
  docker-smoke:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata-edit-ignored (docker-smoke)' || 'docker-smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --file Dockerfile --tag geoparser:smoke .

      - name: Run CLI help
        run: docker run --rm geoparser:smoke --help

      - name: Build demo image
        run: docker build --file demo/Dockerfile --tag geoparser-demo:smoke .

      - name: Require a Jupyter token
        shell: bash
        run: |
          set +e
          output="$(docker run --rm geoparser-demo:smoke 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -Fq "JUPYTER_TOKEN is required" <<<"$output"
