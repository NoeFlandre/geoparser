name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly, so a CVE published against an unchanged lockfile still surfaces.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      # Audits the locked versions straight from uv.lock, with no `uv sync`,
      # so torch and the CUDA stack are never downloaded. torch (CPU index)
      # and the spaCy model URLs cannot be looked up on PyPI and are reported
      # as skipped.
      #
      # Ignored: transformers advisories whose fixes exist only in 5.x.
      # gliner2 requires transformers<5 (see pyproject.toml), so they cannot be
      # taken yet; remove each ignore once the cap is lifted.
      - name: Audit locked dependencies
        run: |
          uv export --locked --all-groups --no-hashes --no-emit-project \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 \
            --requirement "$RUNNER_TEMP/requirements.txt" \
            --no-deps --disable-pip --progress-spinner off \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-3929

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Uploading results to Security > Code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          # Python is analysed from source; no dependency install needed.
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      # Offline audits only, so the result does not depend on API rate limits.
      # Findings that are accepted carry an inline `zizmor: ignore[...]` with
      # the reason next to the line they refer to.
      - name: zizmor
        run: uvx zizmor==1.30.1 --offline --format github .github/workflows

      # A pinned release verified against its published checksum, rather than
      # piping the project's install script into bash. The runner image ships
      # shellcheck, which actionlint uses for run: blocks.
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint
          ./actionlint -color
