name: Lint

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # Only the lint group, so this job stays at a few seconds; a full
      # `uv sync` would pull torch and the CUDA stack. Ruff's version is
      # pinned in pyproject.toml and locked in uv.lock, so CI and a
      # contributor's machine format identically.
      - name: Install lint tools
        run: uv sync --locked --only-group lint

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format
        run: uv run --no-sync ruff format --check --diff .

      - name: deptry
        run: uv run --no-sync deptry .

  ty:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # This environment intentionally installs just the lint group. The
      # dedicated config ignores unresolved third-party modules here; the full
      # Quality workflow runs ty with the project dependencies installed.
      - name: Install lint tools
        run: uv sync --locked --no-default-groups --only-group lint --no-install-project

      - name: ty check
        run: uv run --no-sync ty check --config-file ty-lint.toml geoparser scripts tests
