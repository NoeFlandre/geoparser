name: Bug report
description: Report a reproducible problem with GeoParser.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Check the existing issues first, then provide a small reproduction.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest input and command or code that reproduces it.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python, GeoParser, operating system, and installed gazetteer versions.
    validations:
      required: true
